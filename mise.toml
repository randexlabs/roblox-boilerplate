[tools]
"github:1Axen/blink" = "0.18.6"
"github:JohnnyMorganz/StyLua" = "2.3.1"
"github:blake-mealey/mantle" = "0.11.18"
"github:jackTabsCode/asphalt" = "1.2.0"
"github:luau-lang/luau" = "0.702"
"github:lune-org/lune" = "0.10.4"
"github:pesde-pkg/pesde" = "0.7.2"
"github:rojo-rbx/rojo" = "7.6.1"
"github:seaofvoices/darklua" = "0.17.3"
prettier = "3.8.0"

[settings]
jobs = 8

[tasks."setup"]
run = ["mise i", "pesde install", "npm install"]

[tasks.tests]
run = "pesde x ernisto/test -- tests"

[tasks."count_lines"]
run = "npx cloc src --exclude-list-file=cloc_exclude_files.txt"

[tasks."format"]
run = "stylua src/"

[tasks."dev:sourcemap"]
run = "rojo sourcemap -o sourcemap.json --watch"

[tasks."dev:syncer"]
run = "rojo serve"

[tasks."dev:blink"]
run = "blink remotes/init.blink -w"

[tasks."dev"]
depends = ["dev:sourcemap", "dev:syncer", "dev:blink"]
