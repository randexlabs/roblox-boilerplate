name: CI
run-name: "branch:${{ github.head_ref || github.ref_name }} | msg:${{ github.event.head_commit.message || github.event.pull_request.title }}"

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    checks:
        name: ${{ matrix.job_name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - job_name: Format Luau
                      run_command: stylua --check .
                    - job_name: Format Prettier
                      run_command: prettier --check .
                    - job_name: Tests
                      run_command: mise run tests

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup mise
              uses: jdx/mise-action@v4.0.1
              with:
                  install: true
                  cache: true

            - name: Run check
              run: ${{ matrix.run_command }}
