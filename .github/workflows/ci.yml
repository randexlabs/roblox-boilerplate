name: CI
run-name: "branch:${{ github.head_ref || github.ref_name }} | msg:${{ github.event.head_commit.message || github.event.pull_request.title }}"

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    checks:
        name: ${{ matrix.job_name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - job_name: Format Luau
                      run_command: stylua --check .
                      requires_node: false
                    - job_name: Format Prettier
                      run_command: pnpm exec prettier --check .
                      requires_node: true
                    - job_name: Spellcheck
                      run_command: pnpm run spellcheck
                      requires_node: true
                    - job_name: Tests
                      run_command: mise run tests
                      requires_node: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup pnpm
              if: ${{ matrix.requires_node }}
              uses: pnpm/action-setup@v5
              with:
                  version: 10.33.0

            - name: Setup Node.js
              if: ${{ matrix.requires_node }}
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              if: ${{ matrix.requires_node }}
              run: pnpm install --frozen-lockfile

            - name: Setup mise
              uses: jdx/mise-action@v4.0.1
              with:
                  install: true
                  cache: true

            - name: Run check
              run: ${{ matrix.run_command }}
